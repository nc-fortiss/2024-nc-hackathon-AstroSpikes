id: mobilenet_lnes_syn
root:
  dataset: "/home/arunkumar/datasets/SPADES"
  data_out: "/home/arunkumar/datasets/SPADES/synthetic"
  checkpoint: "/home/arunkumar/experiments/SPADES/${id}"
  test_data: "/home/arunkumar/experiments/SPADES/mobilenet_lnes_syn/20250318_123726/val_files.csv"

filter:
  method: "get_distribution"
  parameters:
    conditions:
      - [ 280, False ]
      - [ 1000, True ]
      - [ 1280, False ]

data:
  transformation: "lnes"
  source: "synthetic"
  input_size: [640, 360, 3]
  test_split: 0.2

training:
  lr: 1e-4
  num_epochs: 100
  beta_epochs: 5
  verbose: 1
  batch_size: 16
  log_Step: 1
  val_log_Step: 1

model:
  pretrained: False
  trained_weights: /home/arunkumar/experiments/SPADES/mobilenet_lnes_syn/20250318_123726/model_06_2.5003.keras

wandb:
  status: 'offline'
  exp_id: 'ak_mobilenet_lnes_mse_loss'
